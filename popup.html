<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <style>
        /* [แนบ CSS เดิมจากที่เคยให้ไว้ + เพิ่ม CSS สำหรับ Tag] */
        body { width: 100%; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; margin: 0; padding: 16px; box-sizing: border-box; }
        * { box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h1 { font-size: 20px; font-weight: bold; color: #dc2626; margin: 0; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #cbd5e1; }
        .status-dot.online { background-color: #22c55e; }
        .card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 8px 12px; font-size: 13px; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #f8fafc; outline: none; font-family: inherit; }
        input:focus, select:focus, textarea:focus { background-color: white; border-color: #f87171; box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.2); }
        textarea { height: 80px; resize: none; }
        .drop-zone { border: 2px dashed #cbd5e1; border-radius: 10px; transition: all 0.2s; position: relative; }
        .btn-main { width: 100%; background-color: #dc2626; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 12px; cursor: pointer; margin-top: 4px; }
        .btn-secondary { width: 100%; background-color: #e2e8f0; color: #475569; font-weight: bold; padding: 10px; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; }
        #inputSection.hidden { display: none; }
        #reviewSection { display: none; }
        #reviewSection.active { display: block; }
        .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .review-field label { font-size: 10px; color: #64748b; margin-bottom: 2px; }
        .review-field.full { grid-column: span 2; }
        
        /* 🌟 CSS สำหรับ Referral Code Tags */
        .ref-tag { display: inline-block; padding: 4px 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 12px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; user-select: none; transition: all 0.2s; }
        .ref-tag:hover { background: #e2e8f0; }
        .ref-tag.selected { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; font-weight: bold; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .ref-tag .delete-btn { margin-left: 6px; color: #ef4444; font-weight: bold; border: none; background: none; cursor: pointer; font-size: 14px; padding: 0; vertical-align: middle; }
        
        .password-wrapper { position: relative; }
        .eye-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>POST Family AutoFill</h1>
        <div id="modelStatus" class="status-dot"></div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN INPUT SECTION -->
    <!-- ========================================== -->
    <div id="inputSection">
        <div class="card" style="margin-bottom: 12px; padding-bottom: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="margin: 0;">🔑 ตั้งค่าระบบ</label>
                <div style="display: flex; gap: 8px;">
                    <select id="modelSelect" style="padding: 4px 8px; font-size: 11px;"><option value="">Loading...</option></select>
                    <button id="refreshModels" style="background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; padding: 0 8px;">🔄</button>
                </div>
            </div>
            <input type="password" id="apiKey" placeholder="Enter Gemini API Key..." style="margin-top: 8px;">
        </div>

        <div class="card" style="border-color: #fbcfe8; background-color: #fff5f7;">
            <label style="color: #be185d; margin-bottom: 6px;">🚀 ทางลัดเริ่มต้น (Step 1)</label>
            <button id="step1Btn" class="btn-main" style="background-color: #e11d48; margin-top: 0; padding: 10px; font-size: 13px;">
                📑 เปิดเว็บ & กดยอมรับข้อตกลง (Step 1)
            </button>
        </div>

        <!-- 🌟 Referral Code Bank -->
        <div class="card" style="border-color: #bfdbfe;">
            <label style="color: #1e40af; margin-bottom: 8px;">🎁 หมายเลขสมาชิกที่แนะนำ (Referral Code)</label>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="text" id="newRefCodeInput" placeholder="รหัสสมาชิก เช่น 123456" style="flex: 1; padding: 6px;">
                <input type="text" id="newRefNameInput" placeholder="ชื่อเรียก เช่น ฟิวส์" style="flex: 1; padding: 6px;">
                <button id="addRefCodeBtn" style="background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: bold;">+ เพิ่ม</button>
            </div>
            <div id="refCodeContainer" style="display: flex; flex-wrap: wrap; gap: 4px;">
                <!-- Tags จะถูก Render ที่นี่ -->
            </div>
        </div>

        <div class="card">
            <label for="recommendedPostcode" style="color: #1e40af; margin-bottom: 8px;">📮 รหัสไปรษณีย์ที่แนะนำ</label>
            <input type="text" id="recommendedPostcode" placeholder="กรอกรหัสไปรษณีย์ที่ใช้บ่อย">
        </div>

        <!-- Paste Box -->
        <div class="card drop-zone" id="pasteZone">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label style="margin-bottom: 0; color: #1e40af;">📄 ข้อมูลนำเข้า</label>
                <button id="clearInputBtn" style="background: none; border: none; cursor: pointer; font-size: 11px; color: #ef4444;">🗑️ ล้าง</button>
            </div>
            <textarea id="textInput" placeholder="แปะข้อความ หรือรูปภาพบัตรประชาชน / Passport ตรงนี้...&#10;หรือพิมพ์เบอร์โทรศัพท์ และ Email (ถ้ามี) เพิ่มเติม..." style="height: 80px;"></textarea>
            <div id="imagePreviewContainer" class="preview-container" style="display: none; margin-top: 8px;"></div>
        </div>

        <button id="processBtn" class="btn-main">✨ วิเคราะห์ข้อมูล (สกัดข้อมูลจากบัตร ปชช.)</button>
        <button id="skipToReviewBtn" class="btn-secondary">ข้ามไปหน้าตรวจสอบ / กรอกเอง</button>
    </div>

    <!-- ========================================== -->
    <!-- REVIEW VALIDATION SECTION -->
    <!-- ========================================== -->
    <div id="reviewSection">
        <!-- Personal Info Review -->
        <div class="card">
            <label style="margin: 0; color: #0284c7;">👤 ข้อมูลส่วนตัว (Step 2)</label>
            <div class="review-grid" style="margin-top: 8px;">
                <div class="review-field"><label>ชื่อจริง</label><input type="text" id="rev_firstName"></div>
                <div class="review-field"><label>นามสกุล</label><input type="text" id="rev_lastName"></div>
                <div class="review-field"><label>เลขบัตร ปชช.</label><input type="text" id="rev_citizenId"></div>
                <div class="review-field"><label>Passport No.</label><input type="text" id="rev_passport"></div>
                <div class="review-field"><label>เบอร์โทร</label><input type="text" id="rev_phone"></div>
                <div class="review-field full"><label>Email</label><input type="email" id="rev_email"></div>
                
                <div class="review-field full"><label>วันเกิด (วว/ดด/ปปปป)</label>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="rev_dob_day" placeholder="วว" style="width:40px; text-align:center;">
                        <input type="text" id="rev_dob_month" placeholder="ดด" style="width:40px; text-align:center;">
                        <input type="text" id="rev_dob_year" placeholder="ปปปป" style="width:60px; text-align:center;">
                    </div>
                </div>
                
                <!-- 🌟 Password Section -->
                <div class="review-field full">
                    <label>รหัสผ่าน (Password)</label>
                    <div class="password-wrapper">
                        <input type="password" id="rev_password" value="aaaa1111">
                        <span class="eye-icon" id="togglePassword">👁️</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <label style="margin: 0; color: #1e40af;">🎁 ข้อมูลแนะนำ</label>
            <div class="review-grid" style="margin-top: 8px;">
                <div class="review-field"><label for="rev_referralCode">หมายเลขสมาชิกที่แนะนำ</label><input type="text" id="rev_referralCode"></div>
                <div class="review-field"><label for="rev_recommendedPostcode">รหัสไปรษณีย์ที่แนะนำ</label><input type="text" id="rev_recommendedPostcode"></div>
            </div>
        </div>

        <!-- Address Review -->
        <div class="card">
            <label style="margin: 0; color: #16a34a;">🏠 ข้อมูลที่อยู่อาศัย (Step 3)</label>
            <div class="review-grid" style="margin-top: 8px;">
                <div class="review-field full"><label>บ้านเลขที่</label><input type="text" id="rev_houseNo"></div>
                <div class="review-field"><label>หมู่</label><input type="text" id="rev_moo"></div>
                <div class="review-field"><label>ซอย</label><input type="text" id="rev_soi"></div>
                <div class="review-field full"><label>ถนน</label><input type="text" id="rev_road"></div>
                <div class="review-field"><label>ตำบล/แขวง</label><input type="text" id="rev_subDistrict"></div>
                <div class="review-field"><label>อำเภอ/เขต</label><input type="text" id="rev_district"></div>
                <div class="review-field"><label>จังหวัด</label><input type="text" id="rev_province"></div>
                <div class="review-field"><label>รหัสไปรษณีย์</label><input type="text" id="rev_postcode"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <button id="fillStep2Btn" class="btn-main" style="background-color: #0284c7;">🔵 กรอกข้อมูล Step 2</button>
        <button id="fillStep3Btn" class="btn-main" style="background-color: #16a34a; margin-top: 8px;">🟢 กรอกข้อมูล Step 3</button>
        <button id="cancelBtn" class="btn-secondary">ย้อนกลับ / แก้ไขใหม่</button>
    </div>

    <div id="status" class="status-text" style="margin-top: 16px; text-align: center; font-size: 11px; font-weight: bold; color: #94a3b8;">พร้อมทำงาน! แปะรูป หรือข้อความได้เลย</div>

    <script src="popup.js"></script>
</body>
</html>
